<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Mar & Terraza</title><link rel="stylesheet" href="styles.css"><style>body{padding:60px 5vw}.admin{max-width:1200px;margin:auto}.login{max-width:430px;margin:8vh auto;background:white;padding:35px}.login form{display:grid;gap:15px}.dash{display:none}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.table-wrap{overflow:auto;background:white}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.badge{padding:6px 10px;border-radius:99px;background:#e9e2d5}.actions button{border:0;padding:7px 10px;border-radius:7px;cursor:pointer;margin-right:4px}</style></head><body><div class="admin"><div id="login" class="login"><p class="eyebrow">ZONA PRIVADA</p><h1>Administración</h1><form id="loginForm"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Contraseña" required><button class="btn">Entrar</button><p id="loginMsg"></p></form></div><div id="dash" class="dash"><div class="toolbar"><div><p class="eyebrow">GESTIÓN</p><h1>Reservas</h1></div><button id="logout" class="btn">Salir</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Hora</th><th>Cliente</th><th>Personas</th><th>Contacto</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="rows"></tbody></table></div><h2 style="margin-top:60px">Mensajes</h2><div class="table-wrap"><table class="table"><tbody id="messages"></tbody></table></div></div></div><script>
const api=(u,o={})=>fetch(u,{...o,headers:{'Content-Type':'application/json',...(o.headers||{}),...(localStorage.token?{Authorization:'Bearer '+localStorage.token}:{})}}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);return d});const login=$('#login'),dash=$('#dash');function show(){if(localStorage.token){login.style.display='none';dash.style.display='block';load()}else{login.style.display='block';dash.style.display='none'}}$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});localStorage.token=d.token;show()}catch(x){$('#loginMsg').textContent=x.message}};$('#logout').onclick=()=>{localStorage.removeItem('token');show()};async function load(){const [rs,ms]=await Promise.all([api('/api/admin/reservations'),api('/api/admin/messages')]);$('#rows').innerHTML=rs.map(r=>`<tr><td>${r.date}</td><td>${r.time}</td><td><b>${r.name}</b><br>${r.notes||''}</td><td>${r.guests}</td><td>${r.phone}<br>${r.email}</td><td><span class="badge">${r.status}</span></td><td class="actions"><button onclick="setStatus(${r.id},'confirmed')">Confirmar</button><button onclick="setStatus(${r.id},'cancelled')">Cancelar</button></td></tr>`).join('');$('#messages').innerHTML=ms.map(m=>`<tr><td><b>${m.name}</b> · ${m.email}</td><td>${m.message}</td><td>${m.created_at}</td></tr>`).join('')}async function setStatus(id,status){await api('/api/admin/reservations/'+id,{method:'PATCH',body:JSON.stringify({status})});load()}show();</script></body></html>
